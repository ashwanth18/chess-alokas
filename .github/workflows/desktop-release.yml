name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SENTRYCLI_SKIP_DOWNLOAD: '1'
      # Authenticated Electron binary download (avoids GitHub rate limits / hang-ups).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          # Electron postinstall downloads a large binary and often flakes on runners
          # (truncated zip / ECONNRESET). Install packages without scripts first, then
          # fetch Electron with dedicated retries after clearing partial cache files.
          for i in 1 2 3 4 5; do
            if pnpm install --frozen-lockfile --ignore-scripts; then
              break
            fi
            echo "pnpm install failed (attempt $i/5), retrying..."
            sleep $((20 * i))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done

          # Platform binaries skipped by --ignore-scripts (pnpm does not hoist electron to root).
          pnpm rebuild esbuild 2>/dev/null || true

          for i in 1 2 3 4 5; do
            # Drop incomplete downloads that fail checksum on the next attempt.
            find "${ELECTRON_CACHE}" -type f \( -name '*.zip' -o -name '*.zip.part' \) -delete 2>/dev/null || true
            # Resolve install.js from the desktop package (pnpm virtual store path).
            if pnpm --filter @chess-alokas/desktop exec node ./node_modules/electron/install.js; then
              exit 0
            fi
            echo "electron install failed (attempt $i/5), retrying..."
            sleep $((20 * i))
          done
          exit 1

      - name: Fetch bbpPairings v6
        if: matrix.platform != 'mac'
        run: node scripts/fetch-bbp-pairings.mjs

      - name: Build desktop (web + api + electron)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SENTRYCLI_SKIP_DOWNLOAD: '1'
          # Do not pass empty VITE_SUPABASE_* secrets — they override apps/web/.env.desktop.
          VITE_API_URL: https://chess-manager.alokas.com/api
          # Optional: set repo secret VITE_SENTRY_DSN for desktop error reporting (free tier).
          # Empty secrets are stripped in apps/web/vite.config.ts so .env.desktop can still apply.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ORG_URL: ${{ secrets.VITE_SENTRY_ORG_URL }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_APP_VERSION: desktop@${{ github.ref_name }}
        run: pnpm run build:desktop

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Chess Alokas ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            apps/desktop/release/Chess-Alokas-*.exe
            apps/desktop/release/Chess-Alokas-*.AppImage
            apps/desktop/release/Chess-Alokas-*.dmg
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/Chess-Alokas-*
          if-no-files-found: warn
