name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop (web + api + electron)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Do not pass empty VITE_SUPABASE_* secrets — they override apps/web/.env.desktop.
          VITE_API_URL: https://chess-manager.alokas.com/api
        run: pnpm run build:desktop

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Chess Alokas ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            apps/desktop/release/Chess-Alokas-*.exe
            apps/desktop/release/Chess-Alokas-*.AppImage
            apps/desktop/release/Chess-Alokas-*.dmg
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/Chess-Alokas-*
          if-no-files-found: warn
