name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build jobs run third-party install scripts, so they get a read-only token.
# Only the final publish job, which runs no project code, can write to releases.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SENTRYCLI_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native tools skipped by --ignore-scripts
        run: pnpm rebuild esbuild

      - name: Fetch bbpPairings v6 (pairing tests use it)
        run: node scripts/fetch-bbp-pairings.mjs

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    env:
      # CODE SIGNING: when a certificate exists, see "Code signing" in apps/desktop/README.md.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SENTRYCLI_SKIP_DOWNLOAD: '1'
      # Authenticated Electron binary download (avoids GitHub rate limits / hang-ups).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          # Electron postinstall downloads a large binary and often flakes on runners
          # (truncated zip / ECONNRESET). Install packages without scripts first, then
          # fetch Electron with dedicated retries after clearing partial cache files.
          for i in 1 2 3 4 5; do
            if pnpm install --frozen-lockfile --ignore-scripts; then
              break
            fi
            echo "pnpm install failed (attempt $i/5), retrying..."
            sleep $((20 * i))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done

          # Platform binaries skipped by --ignore-scripts (pnpm does not hoist electron to root).
          pnpm rebuild esbuild 2>/dev/null || true

          for i in 1 2 3 4 5; do
            # Drop incomplete downloads that fail checksum on the next attempt.
            find "${ELECTRON_CACHE}" -type f \( -name '*.zip' -o -name '*.zip.part' \) -delete 2>/dev/null || true
            # Resolve install.js from the desktop package (pnpm virtual store path).
            if pnpm --filter @chess-alokas/desktop exec node ./node_modules/electron/install.js; then
              exit 0
            fi
            echo "electron install failed (attempt $i/5), retrying..."
            sleep $((20 * i))
          done
          exit 1

      - name: Fetch bbpPairings v6
        if: matrix.platform != 'mac'
        run: node scripts/fetch-bbp-pairings.mjs

      - name: Build desktop (web + api + electron)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SENTRYCLI_SKIP_DOWNLOAD: '1'
          # Do not pass empty VITE_SUPABASE_* secrets — they override apps/web/.env.desktop.
          VITE_API_URL: https://chess-manager.alokas.com/api
          # Optional: set repo secret VITE_SENTRY_DSN for desktop error reporting (free tier).
          # Empty secrets are stripped in apps/web/vite.config.ts so .env.desktop can still apply.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ORG_URL: ${{ secrets.VITE_SENTRY_ORG_URL }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_APP_VERSION: desktop@${{ github.ref_name }}
        run: pnpm run build:desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/Chess-Alokas-*.exe
            apps/desktop/release/Chess-Alokas-*.AppImage
            apps/desktop/release/Chess-Alokas-*.dmg
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  # Clients see nothing until every platform built. The release stays a draft
  # while assets upload, so "latest" never points at one without its update feed.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check every update feed and installer is present
        shell: bash
        run: |
          for f in latest.yml latest-linux.yml latest-mac.yml Chess-Alokas-Setup-win-x64.exe; do
            test -f "artifacts/$f" || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Create draft release and upload assets
        shell: bash
        run: |
          # A re-run after a failed upload reuses the draft from the first attempt.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Chess Alokas $TAG"
          gh release upload "$TAG" artifacts/* --clobber

      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest
