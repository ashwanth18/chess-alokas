appId: com.chessalokas.desktop
productName: Chess Alokas
# Scoped npm name (@chess-alokas/desktop) is unsafe as a binary name; set explicitly.
executableName: Chess-Alokas
copyright: Copyright © Chess Alokas
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: ../api/desktop-bundle
    to: api
  - from: resources/api.env.example
    to: api.env.example
publish:
  provider: github
  owner: ashwanth18
  repo: chess-alokas
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  # Assisted first install; in-app updates use silent /S via quitAndInstall(true).
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Chess-Alokas-Setup-${os}-${arch}.${ext}
portable:
  artifactName: Chess-Alokas-Portable-${os}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  executableName: Chess-Alokas
  artifactName: Chess-Alokas-${os}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.sports
  artifactName: Chess-Alokas-${os}-${arch}.${ext}
  identity: null
asar: true
