appId: com.chessalokas.desktop
productName: Chess Alokas
copyright: Copyright © Chess Alokas
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: ../api/desktop-bundle
    to: api
  - from: resources/api.env.example
    to: api.env.example
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: Chess-Alokas-Setup-${os}-${arch}.${ext}
portable:
  artifactName: Chess-Alokas-Portable-${os}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  artifactName: Chess-Alokas-${os}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.sports
  artifactName: Chess-Alokas-${os}-${arch}.${ext}
  identity: null
asar: true
