appId: com.chessalokas.desktop
productName: Chess Alokas
# Scoped npm name (@chess-alokas/desktop) is unsafe as a binary name; set explicitly.
executableName: Chess-Alokas
copyright: Copyright © Chess Alokas
directories:
  output: release
  # An icon.png (at least 512x512) placed here is picked up automatically for all platforms.
  buildResources: resources
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
# The API sidecar is development-only, so packaged builds ship no API bundle and no env template.
extraResources:
  - from: ../web/dist
    to: web
publish:
  provider: github
  owner: ashwanth18
  repo: chess-alokas
  releaseType: release
# Runtime hardening. RunAsNode off is why a packaged build cannot start the sidecar.
# GrantFileProtocolExtraPrivileges stays on because the app loads from file://.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  extraResources:
    - from: ../../vendor/bbp-pairings/win-x64/bbpPairings.exe
      to: bbp-pairings/bbpPairings.exe
  # CODE SIGNING: see "Code signing" in README.md. Once a certificate exists, delete
  # signExecutable below and add the publisher name so updates are checked against it:
  #   signtoolOptions:
  #     publisherName: <exact certificate subject CN>
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  # Assisted first install; in-app updates use silent /S via quitAndInstall(true).
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Chess-Alokas-Setup-${os}-${arch}.${ext}
portable:
  artifactName: Chess-Alokas-Portable-${os}-${arch}.${ext}
linux:
  extraResources:
    - from: ../../vendor/bbp-pairings/linux-x64/bbpPairings.exe
      to: bbp-pairings/bbpPairings.exe
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  executableName: Chess-Alokas
  artifactName: Chess-Alokas-${os}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.sports
  artifactName: Chess-Alokas-${os}-${arch}.${ext}
  identity: null
asar: true
