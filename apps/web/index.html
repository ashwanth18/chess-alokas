<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5EF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141412" />
    <title>Chess Alokas: chess tournament software for organizers, arbiters and parents</title>
    <meta
      name="description"
      content="Swiss and FIDE Dutch pairings, floor result entry by PIN and QR, DuitNow receipt approval, live pages for parents, venue TV and certificates. The desk keeps working when the Wi-Fi drops."
    />
    <style>
      /* Layer order first, then the page colours in legacy: unlayered rules would beat index.css's body. */
      @layer legacy, tokens, ui, shell;
      @layer legacy {
        html, body { margin: 0; background: #F7F5EF; }
        @media (prefers-color-scheme: dark) { html, body { background: #141412; } }
      }
      #boot-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 600 1rem/1.4 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        color: #161513;
        background: #F7F5EF;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      #boot-splash svg { width: 1.05em; height: 1.05em; vertical-align: -0.12em; margin-right: 0.4em; }
      #boot-splash p { margin: 0.35rem 0 0; font-size: 0.95rem; font-weight: 400; color: #47443E; }
      @media (prefers-color-scheme: dark) {
        #boot-splash { color: #EFEBE1; background: #141412; }
        #boot-splash p { color: #C0BBAF; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div>
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x=".75" y=".75" width="14.5" height="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="8" y="1" width="7" height="7" fill="currentColor"/><rect x="1" y="8" width="7" height="7" fill="currentColor"/></svg>Chess Alokas
          <p id="boot-splash-msg">Starting…</p>
        </div>
      </div>
    </div>
    <script>
      // Runs before the app bundle (main.tsx) — and must keep working even if
      // that bundle never successfully loads or mounts, since that's exactly
      // the failure mode Sentry (initialized inside the bundle) can't see.
      // This is the only error-reporting path available during that window:
      // it goes through the Electron preload bridge (already live by the
      // time any page script runs) straight to the desktop's local
      // last-error.json / electron-log, independent of the React app.
      function reportBootIssue(code, message, details) {
        var issue = {
          code: code,
          message: message,
          details: details || '',
          at: new Date().toISOString(),
        };
        try {
          sessionStorage.setItem('chess-alokas-boot-issue', JSON.stringify(issue));
        } catch (e) {
          /* ignore */
        }
        try {
          if (window.desktop && window.desktop.reportBootIssue) {
            window.desktop.reportBootIssue(issue);
          }
        } catch (e) {
          /* ignore */
        }
      }

      window.addEventListener('error', function (e) {
        var err = e.error;
        reportBootIssue(
          'RENDERER_JS_ERROR',
          (e.message || 'Unhandled error').slice(0, 300),
          (e.filename || '') + ':' + (e.lineno || '') + (err && err.stack ? '\n' + err.stack : ''),
        );
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var message = reason && reason.message ? reason.message : String(reason);
        reportBootIssue(
          'UNHANDLED_REJECTION',
          String(message).slice(0, 300),
          reason && reason.stack ? String(reason.stack) : '',
        );
      });

      setTimeout(function () {
        var el = document.getElementById('boot-splash-msg');
        if (el) {
          var msg =
            'Still starting (BOOT_UI_STUCK). Use chess-manager.alokas.com in a browser, or send this code to support.';
          el.textContent = msg;
          reportBootIssue('BOOT_UI_STUCK', msg);
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
