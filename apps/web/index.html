<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3d2e" />
    <title>Chess Alokas: chess tournament software for organizers, arbiters and players</title>
    <meta
      name="description"
      content="Swiss and FIDE Dutch pairings, floor result entry by PIN and QR, DuitNow receipt approval, live pages for players, venue TV and certificates. The desk keeps working when the Wi-Fi drops."
    />
    <style>
      /* Layer order first, then the page colour in legacy: unlayered rules would beat index.css's body. */
      @layer legacy, tokens, ui, shell;
      @layer legacy { html, body { margin: 0; background: #0f3d2e; } }
      #boot-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 600 1.05rem/1.4 Georgia, 'Times New Roman', serif;
        color: #d4b98a;
        background: #0f3d2e;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      #boot-splash svg { width: 1.05em; height: 1.05em; vertical-align: -0.12em; margin-right: 0.45em; }
      #boot-splash p { margin: 0.35rem 0 0; font: 400 0.95rem/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #ede3d0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="4" r="2"/><circle cx="3.500" cy="7" r="2"/><circle cx="20.500" cy="7" r="2"/><path d="M3.900 9.600 7.600 13l3.200-7h2.400l3.200 7 3.700-3.400L18.400 18H5.600zM5 19.500h14a1 1 0 0 1 1 1v.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-.5a1 1 0 0 1 1-1z"/></svg>Chess Alokas
          <p id="boot-splash-msg">Starting…</p>
        </div>
      </div>
    </div>
    <script>
      // Runs before the app bundle (main.tsx) — and must keep working even if
      // that bundle never successfully loads or mounts, since that's exactly
      // the failure mode Sentry (initialized inside the bundle) can't see.
      // This is the only error-reporting path available during that window:
      // it goes through the Electron preload bridge (already live by the
      // time any page script runs) straight to the desktop's local
      // last-error.json / electron-log, independent of the React app.
      function reportBootIssue(code, message, details) {
        var issue = {
          code: code,
          message: message,
          details: details || '',
          at: new Date().toISOString(),
        };
        try {
          sessionStorage.setItem('chess-alokas-boot-issue', JSON.stringify(issue));
        } catch (e) {
          /* ignore */
        }
        try {
          if (window.desktop && window.desktop.reportBootIssue) {
            window.desktop.reportBootIssue(issue);
          }
        } catch (e) {
          /* ignore */
        }
      }

      window.addEventListener('error', function (e) {
        var err = e.error;
        reportBootIssue(
          'RENDERER_JS_ERROR',
          (e.message || 'Unhandled error').slice(0, 300),
          (e.filename || '') + ':' + (e.lineno || '') + (err && err.stack ? '\n' + err.stack : ''),
        );
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var message = reason && reason.message ? reason.message : String(reason);
        reportBootIssue(
          'UNHANDLED_REJECTION',
          String(message).slice(0, 300),
          reason && reason.stack ? String(reason.stack) : '',
        );
      });

      setTimeout(function () {
        var el = document.getElementById('boot-splash-msg');
        if (el) {
          var msg =
            'Still starting (BOOT_UI_STUCK). Use chess-manager.alokas.com in a browser, or send this code to support.';
          el.textContent = msg;
          reportBootIssue('BOOT_UI_STUCK', msg);
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
