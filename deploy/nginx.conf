# The default log format writes the whole request line, query string included, which can hold a
# person's coordinates or search. This keeps the path only, without any link secret.
map $uri $log_path {
  ~^/(live|invite|t)/ "/$1/[redacted]";
  ~^/api/public/(live|tables)/ "/api/public/$1/[redacted]";
  default $uri;
}
log_format no_query '$remote_addr [$time_local] "$request_method $log_path" $status $body_bytes_sent';

server {
  access_log /var/log/nginx/access.log no_query;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # pdf.js / Vite may still emit .mjs; default nginx maps that to octet-stream
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
  }

  # Hashed Vite assets — safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # App shell + service worker must revalidate on every visit, or deploys stay invisible
  # until the user clears cache (which also signs them out).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
