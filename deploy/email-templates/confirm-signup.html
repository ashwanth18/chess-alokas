<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your email</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;font-family:Georgia,'Times New Roman',serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e8f0;">
            <tr>
              <td style="padding:28px 28px 8px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#64748b;">
                Chess Alokas
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 0;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.3;color:#0f172a;">
                Confirm your email
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.6;color:#334155;">
                Confirm this address to finish setting up your Chess Alokas account.
              </td>
            </tr>
            <tr>
              <td style="padding:28px 28px 8px;" align="left">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;font-weight:600;padding:12px 22px;">
                  Confirm email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 28px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;line-height:1.5;color:#64748b;">
                If you did not create an account, you can ignore this email.
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;color:#94a3b8;">
            chess-manager.alokas.com
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
