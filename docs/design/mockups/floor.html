<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Floor Zone</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/ds.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;font-size:var(--t-body);position:relative;overflow:hidden;border-inline:0}
[data-theme="sun"] body{font-weight:500}
[data-theme="sun"] .nm-p{font-weight:500}
.hd{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:2px solid var(--ink);min-height:60px}
.hd h1{font-size:var(--t-xl);flex:1;line-height:1.1;min-width:0}
.hd h1 small{display:block;font-size:var(--t-sm);font-weight:400;color:var(--ink2);font-stretch:100%;letter-spacing:0;margin-top:2px}
.icb{min-width:48px;min-height:48px;background:none;border:1.5px solid var(--rule-strong);border-radius:var(--r);font-weight:600;font-size:var(--t-sm);cursor:pointer;padding:0 var(--s3)}
.netline{display:flex;gap:var(--s3);align-items:center;padding:var(--s2) var(--s4);font-size:var(--t-sm);font-weight:600;border-bottom:1px solid var(--rule);min-height:32px}
.netline.ok{color:var(--go)}.netline.wt{color:var(--wait);background:var(--wait-wash)}
.list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--s4)}
.bd-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:0 var(--s3);width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:var(--s3) var(--s4) var(--s3) var(--s3);cursor:pointer;min-height:76px;align-items:center}
.bd-row:active{background:var(--paper2)}
.bd-row .no{font-size:32px;font-weight:800;font-stretch:110%;line-height:1;text-align:right;font-feature-settings:"tnum";padding-right:var(--s2)}
.bd-row .pls{display:grid;gap:var(--s2);line-height:1.22;font-size:17px}
.bd-row .pl{display:flex;gap:var(--s3);align-items:baseline}
.bd-row .res{font-weight:800;color:var(--pen);text-align:right;white-space:nowrap;font-size:var(--t-lg)}
.bd-row .res .dot{margin-left:6px}
.bd-row.done{min-height:0;padding-top:var(--s3);padding-bottom:var(--s3);color:var(--ink2)}
.bd-row.done .no{font-size:20px}.bd-row.done .pls{font-size:var(--t-md);gap:1px}
.bd-row.flag{box-shadow:inset 4px 0 0 var(--flag)}
.sect{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:var(--s4) var(--s4) var(--s2);border-bottom:1px solid var(--rule)}
.tabs{display:grid;grid-template-columns:1.25fr 1fr 1fr;border-top:2px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:60px;background:none;border:0;border-left:1px solid var(--rule);font-weight:700;font-size:var(--t-md);cursor:pointer;line-height:1.15;padding:0 var(--s2)}
.tabs button:first-child{border-left:0}
.tabs small{display:block;font-weight:400;font-size:var(--t-xs);color:var(--ink2)}
.tabs .call{color:var(--flag)}
.toast{position:absolute;left:0;right:0;bottom:62px;background:var(--ink);color:var(--on-ink);padding:var(--s3) var(--s3) var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:center;z-index:5}
.toast .t{flex:1;line-height:1.25;min-width:0;font-size:15px}
.toast .t b{font-weight:800}
.toast button{min-height:48px;min-width:88px;background:var(--on-ink);color:var(--ink);border:0;border-radius:var(--r);font-weight:800;cursor:pointer;font-feature-settings:"tnum"}
.toast::before{content:"";position:absolute;left:0;top:-3px;height:3px;background:var(--pen);width:100%;transform-origin:left;animation:drain 5s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--paper);border-top:3px solid var(--ink);padding:var(--s4);padding-bottom:calc(var(--s4) + env(safe-area-inset-bottom));max-height:96%;overflow:auto}
.sheet header{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.sheet h2{font-size:var(--t-3xl);flex:1}
.sheet h2.s{font-size:var(--t-xl)}
.rbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:84px;padding:var(--s3) var(--s4);margin-bottom:var(--s3);text-align:left;border:2px solid var(--ink);border-radius:var(--r);cursor:pointer;font-size:var(--t-lg);line-height:1.2}
.rbtn .sc{font-size:var(--t-xl);font-weight:800;white-space:nowrap;font-feature-settings:"tnum"}
.rbtn .who{font-size:var(--t-sm);display:block;margin-bottom:2px;font-weight:600}
.rbtn.w{background:#fff;color:#000}.rbtn.w .nm-p{color:#333}
.rbtn.b{background:#000;color:#fff;border-color:#000}.rbtn.b .nm-p{color:#ddd}
[data-theme="dark"] .rbtn.b{border-color:var(--rule-strong)}
.rbtn.w .sq{border-color:#000}.rbtn.b .sq{border-color:#fff}
.rbtn.d{background:var(--paper2);min-height:64px;grid-template-columns:minmax(0,1fr) auto;font-weight:800}
.morer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s2)}
.morer button,.optb{min-height:52px;background:none;border:1.5px solid var(--rule-strong);border-radius:var(--r);font-weight:600;font-size:var(--t-md);cursor:pointer;padding:var(--s2)}
.optb{display:block;width:100%;margin-bottom:var(--s3);text-align:left;padding:var(--s3) var(--s4);font-size:var(--t-body);min-height:60px}
.optb[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.optb small{display:block;font-weight:400}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.pad button{min-height:72px;background:var(--paper2);border:1.5px solid var(--rule-strong);border-radius:var(--r);font-size:var(--t-3xl);font-weight:700;cursor:pointer;font-feature-settings:"tnum"}
.pad button:active{background:var(--paper3)}
.pad .fn{font-size:var(--t-md);background:none}
.pinbox{display:flex;gap:var(--s2);justify-content:center;margin:var(--s4) 0}
.pinbox i{width:44px;height:56px;border:2px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:var(--t-3xl);font-weight:800;border-radius:var(--r);font-feature-settings:"tnum"}
.pinbox i.on{border-color:var(--ink)}
.gate{flex:1;display:flex;flex-direction:column;padding:var(--s4);overflow:auto}
.gate h1{font-size:var(--t-4xl);margin-bottom:var(--s2)}
.gate .sp{flex:1;min-height:var(--s3)}
.err{color:var(--flag);font-weight:600;min-height:1.4em;text-align:center}
.demo{margin:var(--s3) var(--s4)}
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<script src="assets/ds.js"></script>
<script>
const {esc,nameHTML,sq,resText,resSpoken,simulate,newRound,params,splitName,store}=CA;
const sim=simulate(3,CA.SEED);const boards=newRound(sim);
[[1,'1-0'],[2,'1/2'],[3,'0-1'],[5,'1-0'],[6,'1-0']].forEach(([b,r])=>{const x=boards[b-1];x.res=r;x.state='sent';x.by='You'});
const S={screen:params.get('skip')?'zone':'gate',pin:'',err:'',zone:[1,8],sheet:null,offline:false,undo:null,chief:null,board:null,go:'',arb:'Aini'};
let undoTimer=null;
const app=document.getElementById('app');
const first=n=>splitName(n)[0];
const queued=()=>boards.filter(b=>b.state==='queued').length;
function netLine(){if(S.offline){const q=queued();return`<div class="netline wt" role="status"><span class="dot hollow"></span>No Wi-Fi. ${q?`${q} ${q===1?'result':'results'} kept on this phone, will send when back.`:'Keep going, results stay on this phone.'}</div>`}
 return`<div class="netline ok" role="status"><span class="dot"></span>Desk has everything you entered</div>`}
function rowHTML(b){const pending=!b.res;const held=S.undo&&S.undo.bd===b.bd;
 return`<button class="bd-row ${pending?'':'done'} ${b.flag?'flag':''}" data-bd="${b.bd}" aria-label="Board ${b.bd}. White ${esc(b.w.name)}. Black ${esc(b.b.name)}. ${b.res?resSpoken[b.res]:'No result yet'}">
 <span class="no">${b.bd}</span>
 <span class="pls"><span class="pl">${sq('w')}<span>${nameHTML(b.w.name,{nofit:!pending?false:false})}</span></span><span class="pl">${sq('b')}<span>${nameHTML(b.b.name)}</span></span></span>
 ${b.res?`<span class="res">${resText[b.res]}<span class="dot ${b.state==='sent'?'':'hollow'}" title="${b.state==='sent'?'At the desk':'On this phone'}"></span></span>`:'<span></span>'}
 </button>`}
function render(){
 if(S.screen==='gate'){app.innerHTML=`<div class="gate">
  <div class="label">Table 12 · Round 4</div><h1 class="display">Enter the round PIN</h1>
  <p class="muted">Imaginary Bay Junior Rapid. Scoring as <b style="color:var(--ink)">${S.arb}</b> <a href="#" onclick="return false">Not you?</a></p>
  <div class="sp"></div>
  <div class="pinbox" aria-label="${S.pin.length} of 6 digits entered">${[0,1,2,3,4,5].map(i=>`<i class="${S.pin[i]?'on':''}">${S.pin[i]||''}</i>`).join('')}</div>
  <div class="err" role="alert">${S.err}</div>
  <div class="pad" style="margin-top:var(--s3)">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="fn" data-k="clear">Clear</button><button data-k="0">0</button><button class="fn" data-k="back" aria-label="Delete last digit">Delete</button></div>
  </div>`;return}
 const zb=boards.filter(b=>b.bd>=S.zone[0]&&b.bd<=S.zone[1]);const pend=zb.filter(b=>!b.res);const done=zb.filter(b=>b.res);
 app.innerHTML=`<header class="hd"><h1 class="display">Round 4 <small>${pend.length} left on boards ${S.zone[0]}–${S.zone[1]}</small></h1><button class="icb" data-cycle-theme aria-label="Change display. Now"><span data-theme-label>Light</span></button></header>
 ${netLine()}
 <div class="list" id="list">
  ${pend.map(rowHTML).join('')||'<p style="padding:var(--s5)" class="muted">All your boards are in. The desk confirms the round.</p>'}
  ${done.length?`<div class="sect">Entered (${done.length})</div>`+done.slice().sort((a,b)=>(b.t||0)-(a.t||0)).map(rowHTML).join(''):''}
  <div class="demo"><b>Mock only</b><button id="wifiDemo" aria-pressed="${S.offline}">${S.offline?'Wi-Fi off':'Pull the Wi-Fi'}</button></div>
 </div>
 ${S.undo?`<div class="toast" role="status"><div class="t">Board ${S.undo.bd}: <b>${esc(S.undo.text)}</b></div><button id="undoBtn">Undo</button></div>`:''}
 <nav class="tabs" aria-label="Floor actions"><button id="zoneBtn">Boards ${S.zone[0]}–${S.zone[1]}<small>Change</small></button><button id="goBtn">Go to<small>board no.</small></button><button id="chiefBtn" class="call">Call chief</button></nav>
 ${sheetHTML()}`;
 document.querySelectorAll('[data-theme-label]').forEach(e=>{e.textContent={light:'Light',dark:'Dark',sun:'Sunlight'}[document.documentElement.getAttribute('data-theme')]||'Light'});
}
function sheetHTML(){
 if(!S.sheet)return'';
 const b=S.board;
 if(S.sheet==='result')return`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Result for board ${b.bd}">
  <header><h2 class="display">Board ${b.bd}</h2><span class="chip plain">${b.sec}</span><button class="icb" id="closeSheet">Close</button></header>
  <button class="rbtn w" data-res="1-0"><span><span class="who">White won</span>${nameHTML(b.w.name)}</span><span class="sc">1–0</span></button>
  <button class="rbtn d" data-res="1/2"><span>Draw</span><span class="sc">½–½</span></button>
  <button class="rbtn b" data-res="0-1"><span><span class="who">Black won</span>${nameHTML(b.b.name)}</span><span class="sc">0–1</span></button>
  <div class="morer"><button id="moreBtn">Forfeit</button><button id="cardBtn">Card</button><button id="chiefHere" style="color:var(--flag)">Call chief</button></div>
 </div></div>`;
 if(S.sheet==='forfeit'){const f=S.ff;return`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Forfeit on board ${b.bd}">
  <header><h2 class="display s">Board ${b.bd}: who did not play?</h2><button class="icb" id="closeSheet">Back</button></header>
  ${[['1F','Black absent','White wins by forfeit: '+first(b.w.name)],['0F','White absent','Black wins by forfeit: '+first(b.b.name)],['0-0','Both absent','No points for either']].map(([k,l,s])=>`<button class="optb" aria-pressed="${f===k}" data-ff="${k}">${l}<small>${esc(s)}</small></button>`).join('')}
  <button class="btn primary lg block" id="ffOk" ${f?'':'disabled'} style="min-height:60px">${f?`Confirm: ${{'1F':'Black absent','0F':'White absent','0-0':'both absent'}[f]}`:'Pick one first'}</button>
 </div></div>`}
 if(S.sheet==='card')return`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Card on board ${b.bd}">
  <header><h2 class="display s">Board ${b.bd}: give a card</h2><button class="icb" id="closeSheet">Back</button></header>
  ${[[b.w,'w'],[b.b,'b']].map(([p,c])=>`<p style="margin:var(--s3) 0 var(--s2)">${sq(c)} ${nameHTML(p.name)}</p><div class="morer" style="grid-template-columns:1fr 1fr"><button data-card>Warning <small class="faint">0 of 3</small></button><button data-card>Illegal move <small class="faint">0 of 2</small></button></div>`).join('')}
 </div></div>`;
 if(S.sheet==='locked')return`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Board ${b.bd} already entered"><header><h2 class="display">Board ${b.bd}</h2><button class="icb" id="closeSheet">Close</button></header><p style="font-size:var(--t-3xl);font-weight:800;margin-bottom:var(--s2)">${resText[b.res]}</p><p class="muted" style="margin-bottom:var(--s4)">${esc(b.by||'You')} entered this and the desk has it. To change it, ask the desk so the record stays straight.</p><button class="btn lg block" id="chiefHere" style="min-height:60px;color:var(--flag);border-color:var(--flag)">Call chief to this board</button></div></div>`;
 if(S.sheet==='chief'){const t=S.board?`Board ${S.board.bd}`:'Which board?';return`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Call chief arbiter">
  <header><h2 class="display s">Call chief: ${t}</h2><button class="icb" id="closeChief">Close</button></header>
  ${S.chief?`<p style="font-size:var(--t-lg);font-weight:700;margin:var(--s3) 0">${S.offline?'Saved on this phone. It will go when Wi-Fi returns.':'The desk has it.'}</p><p class="muted" style="margin-bottom:var(--s4)">${S.offline?'If it is urgent, walk over to the chief now.':'Stay at the board. The chief can see the board number and your name.'}</p><button class="btn lg block" id="closeChief2" style="min-height:60px">Done</button>`:
  ['Clock malfunction','Illegal move dispute','Player missing','Something else'].map(r=>`<button class="optb" data-chief="${r}">${r}</button>`).join('')}
 </div></div>`}
 if(S.sheet==='go')return`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Go to board">
  <header><h2 class="display s">Go to board</h2><button class="icb" id="closeGo">Close</button></header>
  <div class="pinbox" style="margin:var(--s2) 0"><i class="on" style="width:120px">${S.go||'&nbsp;'}</i></div>
  <div class="err" role="alert" style="margin-bottom:var(--s2)">${S.goErr||''}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-g="${n}">${n}</button>`).join('')}<button class="fn" data-g="back">Delete</button><button data-g="0">0</button><button class="fn" data-g="ok" style="background:var(--ink);color:var(--on-ink)">Open</button></div>
 </div></div>`;
 if(S.sheet==='zone')return`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Choose your boards">
  <header><h2 class="display s">My boards</h2><button class="icb" id="closeSheet">Close</button></header>
  ${[[1,8,'Under 12'],[9,18,'Under 18'],[1,18,'All boards']].map(([a,z,l])=>`<button class="optb" aria-pressed="${S.zone[0]===a&&S.zone[1]===z}" data-zone="${a},${z}">Boards ${a}–${z}<small>${l}</small></button>`).join('')}
 </div></div>`;
 return'';
}
function commit(b){if(b.state==='held'){b.state=S.offline?'queued':'sent'}}
function enter(r){const b=S.board;
 if(S.undo){const o=boards.find(x=>x.bd===S.undo.bd);commit(o);clearTimeout(undoTimer)}
 b.res=r;b.state='held';b.t=Date.now();
 const winner=r==='1-0'||r==='1F'?`${first(b.w.name)} (White) won`:r==='0-1'||r==='0F'?`${first(b.b.name)} (Black) won`:r==='0-0'?'both absent':'Draw';
 S.undo={bd:b.bd,text:winner};S.sheet=null;S.board=null;S.ff=null;render();
 if(navigator.vibrate)navigator.vibrate(20);
 undoTimer=setTimeout(()=>{commit(b);S.undo=null;render()},5000);
}
document.addEventListener('click',e=>{const t=e.target;let x;
 if(x=t.closest('[data-k]')){const k=x.dataset.k;S.err='';if(k==='clear')S.pin='';else if(k==='back')S.pin=S.pin.slice(0,-1);else if(S.pin.length<6)S.pin+=k;
  if(S.pin.length===6){if(S.pin==='000000'){S.err='That PIN is not for round 4. Ask the desk for the new one.';S.pin=''}else{S.screen='zone'}}render();return}
 if(t.closest('#wifiDemo')){S.offline=!S.offline;if(!S.offline)boards.forEach(b=>{if(b.state==='queued')b.state='sent'});render();return}
 if(t.closest('#undoBtn')){const b=boards.find(q=>q.bd===S.undo.bd);b.res=null;b.state=null;clearTimeout(undoTimer);S.undo=null;render();return}
 if(x=t.closest('.bd-row')){const b=boards[+x.dataset.bd-1];S.board=b;S.sheet=(b.res&&b.state==='sent')?'locked':'result';render();return}
 if(x=t.closest('[data-res]')){enter(x.dataset.res);return}
 if(t.closest('#moreBtn')){S.sheet='forfeit';S.ff=null;render();return}
 if(t.closest('#cardBtn')){S.sheet='card';render();return}
 if(t.closest('#chiefHere')){S.sheet='chief';S.chief=null;render();return}
 if(x=t.closest('[data-ff]')){S.ff=x.dataset.ff;render();return}
 if(t.closest('#ffOk')&&S.ff){enter(S.ff);return}
 if(t.closest('[data-card]')){S.sheet='result';render();return}
 if(t.closest('#closeSheet')){if(S.sheet==='forfeit'||S.sheet==='card'){S.sheet='result'}else{S.sheet=null;S.board=null}render();return}
 if(t.closest('#zoneBtn')){S.sheet='zone';render();return}
 if(x=t.closest('[data-zone]')){S.zone=x.dataset.zone.split(',').map(Number);S.sheet=null;render();return}
 if(t.closest('#goBtn')){S.sheet='go';S.go='';S.goErr='';render();return}
 if(t.closest('#closeGo')){S.sheet=null;render();return}
 if(x=t.closest('[data-g]')){const g=x.dataset.g;S.goErr='';if(g==='back')S.go=S.go.slice(0,-1);else if(g==='ok'){const b=boards[+S.go-1];if(b){S.board=b;S.sheet='result'}else S.goErr='No board '+S.go+' this round.'}else if(S.go.length<3)S.go+=g;render();return}
 if(t.closest('#chiefBtn')){S.sheet='chief';S.chief=null;S.board=boards.find(b=>!b.res&&b.bd>=S.zone[0]);render();return}
 if(x=t.closest('[data-chief]')){S.chief=x.dataset.chief;if(S.board)S.board.flag=true;render();return}
 if(t.closest('#closeChief')||t.closest('#closeChief2')){S.sheet=null;S.chief=null;S.board=null;render();return}
 if(t.matches('[data-scrim]')){S.sheet=null;S.board=null;render();return}
});
render();
</script>
</body>
</html>
